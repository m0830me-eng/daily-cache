name: Discord Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Discord test message
        env:
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
        run: |
          python - <<'PY'
          import os
          from curl_cffi import requests

          webhook = os.environ.get("CY_WEBHOOK", "").strip()
          mention_id = os.environ.get("DISCORD_MENTION_ID", "").strip()

          if not webhook:
              raise SystemExit("CY_WEBHOOK secret is missing")

          content = "✅ CGV 용산 알림 테스트"
          if mention_id:
              content = f"<@{mention_id}>\n\n{content}\n멘션 테스트 정상"

          payload = {
              "content": content,
              "allowed_mentions": {
                  "users": [mention_id] if mention_id else []
              }
          }

          r = requests.post(
              webhook,
              json=payload,
              impersonate="chrome",
              timeout=15,
          )

          print("Discord status:", r.status_code)
          print("Discord response:", r.text[:500])

          if r.status_code not in (200, 204):
              raise SystemExit(f"Discord webhook failed: HTTP {r.status_code}")
          PY
