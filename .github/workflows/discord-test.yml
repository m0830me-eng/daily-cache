name: Discord Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord test message
        shell: bash
        env:
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("CY_WEBHOOK", "").strip()
          mention_id = os.environ.get("DISCORD_MENTION_ID", "").strip()

          if not webhook:
              raise SystemExit("CY_WEBHOOK secret is missing")

          content = "✅ CGV 용산 알림 테스트"
          if mention_id:
              content = f"<@{mention_id}>\n\n" + content + "\n멘션 테스트 정상"

          payload = {
              "content": content,
              "allowed_mentions": {
                  "users": [mention_id] if mention_id else []
              }
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(req, timeout=15) as response:
              print("Discord status:", response.status)
          PY
