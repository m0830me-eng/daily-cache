name: daily-cache

on:
workflow_dispatch:
inputs:
run_seconds:
description: "Manual test seconds"
required: false
default: "120"

schedule:
# KST 06:02
- cron: "2 21 * * *"
# KST 11:42
- cron: "42 2 * * *"
# KST 17:22
- cron: "22 8 * * *"

permissions:
contents: write

concurrency:
group: cgv-yongsan-monitor
cancel-in-progress: false

jobs:
monitor:
runs-on: ubuntu-latest
timeout-minutes: 345

```
steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: |
      pip install -r requirements.txt

  - name: Set monitoring duration
    id: duration
    shell: bash
    run: |
      if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
        echo "seconds=${{ inputs.run_seconds }}" >> "$GITHUB_OUTPUT"
      else
        case "${{ github.event.schedule }}" in
          "2 21 * * *")
            echo "seconds=20220" >> "$GITHUB_OUTPUT"
            ;;
          "42 2 * * *")
            echo "seconds=20220" >> "$GITHUB_OUTPUT"
            ;;
          "22 8 * * *")
            echo "seconds=23760" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "seconds=120" >> "$GITHUB_OUTPUT"
            ;;
        esac
      fi

  - name: Run daily cache
    env:
      CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
      DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
      RUN_SECONDS: ${{ steps.duration.outputs.seconds }}
    run: |
      python -u daily_cache.py

  - name: Save state
    if: always()
    shell: bash
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add seen_cgv_yongsan.json baseline_cgv_yongsan.done 2>/dev/null || true

      if git diff --cached --quiet; then
        echo "No state changes"
      else
        git commit -m "Update state"
        git pull --rebase
        git push
      fi
