name: daily-cache

on:
workflow_dispatch:

permissions:
contents: write

jobs:
monitor:
runs-on: ubuntu-latest
timeout-minutes: 5

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install
    run: pip install -r requirements.txt

  - name: Run
    env:
      CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
      DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
      RUN_SECONDS: "120"
    run: python -u daily_cache.py
```
