name: CGV Yongsan Auto Speed Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cgv-yongsan-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
          RUN_SECONDS: "19200"
        run: python -u cinema_alert.py

      - name: Save state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_cgv_yongsan.json baseline_cgv_yongsan.done 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update CGV Yongsan state"
            git pull --rebase
            git push
          fi

